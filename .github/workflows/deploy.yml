# Deploys every push to master to the droplet (see UPDATING.md).
# Lint and build run on GitHub first, so broken code never reaches the live site.
# Then it SSHes in and runs deploy.sh, which pulls, installs, builds and restarts what changed.
name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

# Only one deploy at a time, and never cancel one halfway through.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --prefix client
      - run: npm --prefix client run lint
      - run: npm --prefix client run build

  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Secrets pasted from a Windows browser can carry CRLF line endings and stray spaces,
      # which break the key and every known_hosts line, so they're stripped here.
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          LOGIN: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' | sed 's/^[[:space:]]*//; /^$/d' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          echo "DEPLOY_HOST=$(printf '%s' "$HOST" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          echo "DEPLOY_LOGIN=$(printf '%s' "$LOGIN" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          echo "Host keys accepted (from DEPLOY_KNOWN_HOSTS):"
          ssh-keygen -lf ~/.ssh/known_hosts
      - name: Run deploy.sh on the droplet
        run: ssh -o BatchMode=yes "$DEPLOY_LOGIN@$DEPLOY_HOST" 'bash /opt/twinstack/web/deploy.sh'
      # Host keys are public, so printing them is safe. Compare with the list above.
      - name: Show the droplet's host keys
        if: failure()
        run: |
          echo "Host keys the droplet actually offers:"
          ssh-keyscan -T 15 "$DEPLOY_HOST" 2>/dev/null | ssh-keygen -lf - || echo "Couldn't reach $DEPLOY_HOST on port 22."
